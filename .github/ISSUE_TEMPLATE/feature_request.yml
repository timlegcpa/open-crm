name: Feature request
description: Suggest something Open CRM should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to get done, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work, for the owner and, if it reaches them, for clients.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
  - type: checkboxes
    id: fit
    attributes:
      label: Fit
      options:
        - label: It fits a single-owner CRM and client portal for any kind of business.
          required: true
